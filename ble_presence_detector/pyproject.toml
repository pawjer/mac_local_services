[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ble-presence-detector"
version = "1.0.0"
description = "BLE presence detection system with MQTT publishing"
authors = [
    {name = "Your Name"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "bleak>=0.21.0",
    "paho-mqtt>=2.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ble-presence-detector = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
